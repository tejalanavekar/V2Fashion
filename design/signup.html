<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2Fashion Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Jost',system-ui,sans-serif}
a{color:inherit}a:hover{opacity:.85}
</style>
</head>
<body>
<div style="width: 1440px; height: 940px; display: flex; flex-direction: column; background: #FFFFFF; color: #2B1620; font-family: 'Jost', system-ui, sans-serif; overflow: hidden">
<header style="height: 84px; flex-shrink: 0; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-bottom: 1px solid #F0DDDF">
    <a href="#" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; font-weight: 700; letter-spacing: 0.08em; color: #A3245B; text-decoration: none">V2FASHION</a>
  </header>
  <section style="flex: 1; display: flex; align-items: center; justify-content: center; background: #FFFFFF">
    <div style="width: 440px; display: flex; flex-direction: column; gap: 22px; padding: 44px 40px; background: #FFFFFF; border: 1px solid #F0DDDF; border-radius: 16px; box-shadow: 0 12px 32px rgba(163,36,91,0.08)">
      <div style="display: flex; flex-direction: column; gap: 6px; text-align: center">
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; font-weight: 600">Create your account</span>
        <span style="font-size: 15px; color: #6C5660">Join V2Fashion for a faster checkout and order tracking.</span>
      </div>
      <button type="button" style="height: 52px; border: 1.5px solid #F0DDDF; border-radius: 8px; background: #FFFFFF; color: #2B1620; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.47c-.28 1.5-1.13 2.77-2.4 3.62v3h3.5c2.04-1.88 3.23-4.66 3.23-8.65z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.9l-3.5-3c-1.08.73-2.46 1.15-4.43 1.15-3.4 0-6.28-2.3-7.3-5.4H.9v3.1C2.9 21.3 7.09 24 12 24z"/><path fill="#FBBC05" d="M4.7 13.85A7.6 7.6 0 0 1 4.28 12c0-.64.11-1.27.42-1.85v-3.1H.9A11.98 11.98 0 0 0 0 12c0 1.93.46 3.75 1.28 5.34l3.42-3.49z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.1-3.1C17.94 1.4 15.24 0 12 0 7.09 0 2.9 2.7.9 6.66l3.8 3.1c1.02-3.1 3.9-5.01 7.3-5.01z"/></svg>
        Continue with Google
      </button>
      <div style="display: flex; align-items: center; gap: 14px; color: #6C5660; font-size: 13px">
        <span style="flex: 1; height: 1px; background: #F0DDDF"></span>OR<span style="flex: 1; height: 1px; background: #F0DDDF"></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label style="font-size: 13px; color: #6C5660">Full name</label>
        <input placeholder="e.g. Ananya Vekar" style="height: 50px; box-sizing: border-box; padding: 0 16px; border-radius: 8px; border: 1px solid #F0DDDF; font-size: 15px; font-family: 'Jost', system-ui, sans-serif; color: #2B1620" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label style="font-size: 13px; color: #6C5660">Email or phone number</label>
        <input placeholder="you@example.com" style="height: 50px; box-sizing: border-box; padding: 0 16px; border-radius: 8px; border: 1px solid #F0DDDF; font-size: 15px; font-family: 'Jost', system-ui, sans-serif; color: #2B1620" />
      </div>
      <button type="button" style="height: 52px; border: 0; border-radius: 8px; background: #A3245B; color: #ffffff; font-size: 16px; font-weight: 600; cursor: pointer">Create account</button>
      <span style="font-size: 13px; color: #6C5660; text-align: center">We'll text or email you a one-time code &mdash; no password needed.</span>
      <div style="height: 1px; background: #F0DDDF"></div>
      <span style="font-size: 14px; text-align: center; color: #6C5660">Already have an account? <a href="#" style="color: #A3245B; font-weight: 600; text-decoration: none">Log in</a></span>
    </div>
  </section>
  <div style="flex-shrink: 0; padding: 20px; text-align: center; font-size: 13px; color: #6C5660; background: #FFFFFF">By creating an account you agree to our Terms and Privacy Policy.</div>
</div>
</body>
</html>
